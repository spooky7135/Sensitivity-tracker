<!DOCTYPE html>
<!--
    Source for og-image.png, the picture shown when the site's link is shared
    (Discord, X, iMessage...). It is not part of the site itself.
    To regenerate: open this page at exactly 1200 x 630 and save a screenshot.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            width: 1200px;
            height: 630px;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            gap: 64px;
            padding: 0 88px;
            box-sizing: border-box;
            font-family: "Barlow", sans-serif;
            color: #efe9f8;
            background-color: #0b0714;
            background-image: radial-gradient(circle at 0% 100%, rgba(181, 123, 255, 0.28), transparent 60%);
        }

        .mark {
            width: 260px;
            height: 260px;
            flex-shrink: 0;
        }

        h1 {
            margin: 0 0 12px;
            font-family: "Barlow Condensed", sans-serif;
            font-size: 104px;
            line-height: 0.95;
        }

        .tagline {
            margin: 0 0 40px;
            font-size: 34px;
            font-weight: 500;
            color: #9c90b3;
        }

        /* A worked example, so the card shows what the site does. */
        .example {
            display: flex;
            align-items: baseline;
            gap: 20px;
            margin: 0;
            font-size: 34px;
            font-weight: 600;
        }

        .example .value {
            font-family: "Barlow Condensed", sans-serif;
            font-size: 64px;
            color: #b57bff;
        }

        .example .arrow {
            color: #655a7c;
        }
    </style>
</head>
<body>
    <img class="mark" src="../site/favicon.svg" alt="">

    <div>
        <h1>Sensitivity Converter</h1>
        <p class="tagline">Same hand movement, same turn, in every game you play.</p>
        <p class="example">
            <span>CS2</span> <span class="value">1</span>
            <span class="arrow">→</span>
            <span>Valorant</span> <span class="value">0.3143</span>
        </p>
    </div>
</body>
</html>
