<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark rounded square so the icon shows on light and dark browser tabs -->
  <rect width="64" height="64" rx="14" fill="#150f24"/>

  <!-- The 360 degree turn: an arc going clockwise most of the way round -->
  <path d="M 49.32 22 A 20 20 0 1 1 32 12"
        fill="none" stroke="#b57bff" stroke-width="5" stroke-linecap="round"/>
  <!-- Arrowhead at the end of the arc, pointing the way it turns -->
  <path d="M 39 12 L 30.5 6 L 30.5 18 Z" fill="#b57bff"/>

  <!-- Crosshair in the middle -->
  <g stroke="#efe9f8" stroke-width="3.5" stroke-linecap="round">
    <line x1="32" y1="22.5" x2="32" y2="27"/>
    <line x1="32" y1="37" x2="32" y2="41.5"/>
    <line x1="22.5" y1="32" x2="27" y2="32"/>
    <line x1="37" y1="32" x2="41.5" y2="32"/>
  </g>
  <circle cx="32" cy="32" r="2.2" fill="#efe9f8"/>
</svg>
