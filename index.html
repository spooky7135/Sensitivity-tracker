<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sensitivity Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="calculator">

        <h1>Game Sensitivity Converter</h1>

        <div class="input-group">
            <label for="from-game">Convert from</label>
            <select id="from-game"></select>
        </div>

        <div class="input-group">
            <label for="to-game">Convert to</label>
            <select id="to-game"></select>
        </div>

        <div class="input-group">
            <label for="dpi">Mouse DPI</label>
            <input
                type="number"
                id="dpi"
                placeholder="800"
            >
        </div>

        <div class="input-group">
            <label for="sensitivity">Your Sensitivity (in the "from" game)</label>
            <input
                type="number"
                id="sensitivity"
                placeholder="0.35"
                step="any"
            >
        </div>

        <button id="calculate-button">
            Calculate
        </button>

        <p id="error-message" class="error"></p>

        <div id="result">
            <p>eDPI: <span id="edpi-result">---</span></p>
            <p>Distance per 360°: <span id="cm-result">---</span></p>
            <p>Converted sensitivity: <strong id="converted-result">---</strong></p>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="script.js"></script>

</body>
</html>
