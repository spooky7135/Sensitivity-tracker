<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sensitivity Converter</title>

    <!-- Fonts: Barlow (body) and Barlow Condensed (headline and numbers) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header narrow">
        <a class="brand" href="index.html">Sensitivity Converter</a>
        <nav>
            <a href="index.html" aria-current="page">Converter</a>
            <a href="games.html">Supported games</a>
        </nav>
    </header>

    <main class="calculator">

        <h1>Convert your sensitivity between games</h1>
        <p class="intro">Same hand movement, same turn, in every game you play.</p>

        <div class="game-row">
            <div class="input-group">
                <label for="from-game">Convert from</label>
                <select id="from-game"></select>
            </div>

            <button type="button" id="swap-button" class="small-button" disabled>Swap</button>

            <div class="input-group">
                <label for="to-game">Convert to</label>
                <select id="to-game"></select>
            </div>
        </div>

        <div class="fields">
            <div class="input-group">
                <label for="dpi">Mouse DPI</label>
                <input
                    type="number"
                    id="dpi"
                    placeholder="800"
                >
            </div>

            <div class="input-group">
                <label for="sensitivity">Current sensitivity</label>
                <input
                    type="number"
                    id="sensitivity"
                    placeholder="0.35"
                    step="any"
                >
            </div>
        </div>

        <button type="button" id="calculate-button" class="convert-button">
            Convert
        </button>

        <p id="error-message" class="error"></p>

        <section id="result" aria-live="polite">
            <p class="result-label" id="result-label">Converted sensitivity</p>
            <div class="result-row">
                <p class="result-value" id="converted-result">---</p>
                <button type="button" id="copy-button" class="small-button" disabled>Copy</button>
            </div>

            <!-- The ruler: how far the mouse travels for one full turn -->
            <div class="ruler" aria-hidden="true">
                <div class="ruler-track">
                    <div class="ruler-fill" id="ruler-fill"></div>
                </div>
                <div class="ruler-scale">
                    <span>0</span>
                    <span>20</span>
                    <span>40</span>
                    <span>60</span>
                    <span>80 cm</span>
                </div>
            </div>

            <p class="result-note">Mouse travel for one full turn: <span id="cm-result">---</span></p>
            <p class="result-note">eDPI: <span id="edpi-result">---</span></p>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="supabase-client.js"></script>
    <script src="sens-math.js"></script>
    <script src="script.js"></script>

</body>
</html>
