<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sensitivity Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="calculator">

        <h1>Game Sensitivity Calculator</h1>

        <div class="input-group">
            <label for="dpi">Mouse DPI</label>
            <input
                type="number"
                id="dpi"
                placeholder="800"
            >
        </div>

        <div class="input-group">
            <label for="sensitivity">In-Game Sensitivity</label>
            <input
                type="number"
                id="sensitivity"
                placeholder="0.35"
                step="0.01"
            >
        </div>

        <button id="calculate-button">
            Calculate
        </button>

        <div id="result">
            <p>eDPI: <span id="edpi-result">---</span></p>
        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
