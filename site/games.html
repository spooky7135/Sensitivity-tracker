<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Supported games | Sensitivity Tracker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">

    <!-- Site icon: SVG for modern browsers, PNG as a fallback, and the iPhone home-screen icon -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">
        <a class="brand" href="index.html">
            <!-- Logo mark: the same design as favicon.svg, without the dark square -->
            <svg class="brand-mark" viewBox="7 5 50 50" aria-hidden="true">
                <path d="M 49.32 22 A 20 20 0 1 1 32 12" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/>
                <path d="M 39 12 L 30.5 6 L 30.5 18 Z" fill="var(--accent)"/>
                <g stroke="currentColor" stroke-width="3.5" stroke-linecap="round">
                    <line x1="32" y1="22.5" x2="32" y2="27"/>
                    <line x1="32" y1="37" x2="32" y2="41.5"/>
                    <line x1="22.5" y1="32" x2="27" y2="32"/>
                    <line x1="37" y1="32" x2="41.5" y2="32"/>
                </g>
                <circle cx="32" cy="32" r="2.2" fill="currentColor"/>
            </svg>
            Sensitivity Tracker
        </a>
        <nav>
            <a href="index.html">Converter</a>
            <a href="games.html" aria-current="page">Supported games</a>
        </nav>
    </header>

    <main class="showcase">

        <h1>Supported games</h1>
        <p class="intro">Every game here converts to every other one.</p>

        <p class="legend">
            The purple wedge shows how far each game turns for the same mouse
            movement at sensitivity 1. A wider wedge means that game needs a
            smaller sensitivity number.
        </p>

        <p id="status-message" class="status" aria-live="polite">Loading games...</p>

        <!-- games.js adds one <li> per game here -->
        <ul id="game-list" class="game-list"></ul>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="supabase-client.js"></script>
    <script src="games.js"></script>

</body>
</html>
